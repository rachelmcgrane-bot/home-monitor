services:
  - type: web
    name: home-monitor
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false          # paste your Anthropic API key in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
